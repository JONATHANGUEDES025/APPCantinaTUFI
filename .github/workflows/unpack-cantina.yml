name: Descompactar Cantina TUFI

on:
  push:
    paths:
      - .github/workflows/unpack-cantina.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Criar cantina_pro.py completo
        run: |
          python - <<'PY'
          import base64
          import gzip
          import pathlib

          payload = """"""

          source = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          compile(source, 'cantina_pro.py', 'exec')
          root = pathlib.Path('.')
          (root / 'cantina_pro.py').write_text(source, encoding='utf-8', newline='\n')
          for name in ['cantina_pro.py.gz.part1', 'cantina_pro.py.gz.part2', 'cantina_pro.py.gz.part3']:
              path = root / name
              if path.exists():
                  path.unlink()
          workflow = root / '.github' / 'workflows' / 'unpack-cantina.yml'
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Salvar no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar aplicativo completo sem partes compactadas"
          git push
